[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azbrief-enterprise"
version = "1.0.0"
description = "Azure Update Intelligence Agent - environment-grounded change intelligence for enterprise Azure operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AzBrief Team"}
]
keywords = ["azure", "ai", "langchain", "foundry", "multi-agent", "container-apps", "updates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
    "azure-identity>=1.15.0",
    "azure-mgmt-resourcegraph>=8.0.0",
    "azure-mgmt-costmanagement>=4.0.0",
    "azure-communication-email>=1.0.0",
    "azure-monitor-query>=1.2.0",
    "azure-monitor-ingestion>=1.0.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "structlog>=24.1.0",
    # Foundry is the only model backend. Prompt Agents are versioned through the
    # current Agent Service SDK and invoked through the Responses API.
    "azure-ai-projects>=2.5.0,<3.0",
    "azure-ai-agentserver-responses==2.0.0b0",
    "mcp>=2.0.0,<3.0",
    "azure-monitor-opentelemetry>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[project.scripts]
azbrief-scheduler = "src.scheduler:main"

[project.urls]
Homepage = "https://github.com/Networkdog/AzBriefEnterprise"
Repository = "https://github.com/Networkdog/AzBriefEnterprise"
Documentation = "https://github.com/Networkdog/AzBriefEnterprise#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
