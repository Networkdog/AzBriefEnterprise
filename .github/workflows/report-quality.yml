name: Report Quality Gate

# Evaluates AzBrief report quality (G-Eval LLM-as-a-Judge) and agent trajectory
# (rule-based process quality) against live Azure data, and FAILS the run on a
# quality regression. Because it calls Azure OpenAI (and optionally Azure), it is
# NOT a per-commit gate: it runs nightly, on demand, and on PRs that touch the
# prompt assembly (the most common source of quality regressions).
#
# Required secrets (workflow is skipped gracefully if absent):
#   AZURE_TENANT_ID, AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY,
#   AZURE_OPENAI_DEPLOYMENT_NAME
# Optional: AZURE_SUBSCRIPTION_ID (tenant-wide query if omitted).

on:
  workflow_dispatch:
    inputs:
      fail_under:
        description: "Minimum passing G-Eval score (1-5)"
        required: false
        type: string
        default: "3.0"
      min_trajectory:
        description: "Minimum passing trajectory score (0-100)"
        required: false
        type: string
        default: "60"
      iterations:
        description: "Self-improvement iterations"
        required: false
        type: string
        default: "1"
  schedule:
    # Nightly at 18:00 UTC (03:00 KST) — catches drift from live-data changes.
    - cron: "0 18 * * *"
  pull_request:
    branches: [main]
    paths:
      - "src/agent/prompts/**"
      - "src/agent/geval.py"
      - "src/agent/trajectory.py"
      - "src/email/**"

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Check Azure OpenAI secrets
        id: check
        run: |
          if [ -n "$AZURE_OPENAI_ENDPOINT" ] && [ -n "$AZURE_TENANT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Azure OpenAI secrets detected — quality gate will run."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — AZURE_OPENAI_ENDPOINT or AZURE_TENANT_ID secret not configured."
          fi
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  quality-gate:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "import src"

      - name: Run report quality gate
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          AZBRIEF_VERBOSE: "false"
          FAIL_UNDER: ${{ github.event.inputs.fail_under || '3.0' }}
          MIN_TRAJECTORY: ${{ github.event.inputs.min_trajectory || '60' }}
          ITERATIONS: ${{ github.event.inputs.iterations || '1' }}
        run: |
          python -m scripts.evaluate_report \
            --latest \
            --with-html \
            --iterate "${ITERATIONS}" \
            --fail-under "${FAIL_UNDER}" \
            --min-trajectory "${MIN_TRAJECTORY}"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-quality-artifacts
          path: eval_runs/
          retention-days: 14
          if-no-files-found: ignore
