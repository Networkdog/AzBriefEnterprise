name: Report Quality Gate

# Evaluates AzBrief report quality (G-Eval LLM-as-a-Judge) and agent trajectory
# (rule-based process quality) against live Azure data, and FAILS the run on a
# quality regression. Because it calls Microsoft Foundry Agent Service and Azure, it is
# NOT a per-commit gate: it runs nightly, on demand, and on PRs that touch the
# prompt assembly (the most common source of quality regressions).
#
# Required repository variables (workflow is skipped gracefully if absent):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   FOUNDRY_PROJECT_ENDPOINT, FOUNDRY_COORDINATOR_AGENT_NAME,
#   FOUNDRY_RESOURCE_GRAPH_AGENT_NAME, FOUNDRY_AZURE_MCP_AGENT_NAME,
#   FOUNDRY_AZURE_API_AGENT_NAME, FOUNDRY_REPORT_WRITER_AGENT_NAME,
#   FOUNDRY_QUALITY_REVIEWER_AGENT_NAME.

on:
  workflow_dispatch:
    inputs:
      fail_under:
        description: "Minimum passing G-Eval score (1-5)"
        required: false
        type: string
        default: "3.0"
      min_trajectory:
        description: "Minimum passing trajectory score (0-100)"
        required: false
        type: string
        default: "60"
      iterations:
        description: "Self-improvement iterations"
        required: false
        type: string
        default: "1"
  schedule:
    # Nightly at 18:00 UTC (03:00 KST) — catches drift from live-data changes.
    - cron: "0 18 * * *"
  pull_request:
    branches: [main]
    paths:
      - "src/agent/prompts/**"
      - "src/agent/foundry_backend.py"
      - "src/config.py"
      - "src/agent/geval.py"
      - "src/agent/trajectory.py"
      - "src/email/**"

permissions:
  contents: read
  id-token: write

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Check Foundry configuration
        id: check
        run: |
          missing=0
          for key in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            FOUNDRY_PROJECT_ENDPOINT \
            FOUNDRY_COORDINATOR_AGENT_NAME \
            FOUNDRY_RESOURCE_GRAPH_AGENT_NAME \
            FOUNDRY_AZURE_MCP_AGENT_NAME \
            FOUNDRY_AZURE_API_AGENT_NAME \
            FOUNDRY_REPORT_WRITER_AGENT_NAME \
            FOUNDRY_QUALITY_REVIEWER_AGENT_NAME; do
            if [ -z "$(jq -r --arg key "$key" '.[$key] // empty' <<< "$REPOSITORY_VARS")" ]; then
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Foundry Agent Service configuration detected — quality gate will run."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — Foundry/OIDC repository variables are incomplete."
          fi
        env:
          REPOSITORY_VARS: ${{ toJSON(vars) }}

  quality-gate:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Foundry configuration
        id: config
        env:
          REPOSITORY_VARS: ${{ toJSON(vars) }}
        run: |
          for key in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            FOUNDRY_PROJECT_ENDPOINT \
            FOUNDRY_COORDINATOR_AGENT_NAME \
            FOUNDRY_RESOURCE_GRAPH_AGENT_NAME \
            FOUNDRY_AZURE_MCP_AGENT_NAME \
            FOUNDRY_AZURE_API_AGENT_NAME \
            FOUNDRY_REPORT_WRITER_AGENT_NAME \
            FOUNDRY_QUALITY_REVIEWER_AGENT_NAME; do
            value=$(jq -r --arg key "$key" '.[$key] // empty' <<< "$REPOSITORY_VARS")
            output_name=$(tr '[:upper:]' '[:lower:]' <<< "$key")
            echo "::add-mask::$value"
            echo "$output_name=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ steps.config.outputs.azure_client_id }}
          tenant-id: ${{ steps.config.outputs.azure_tenant_id }}
          subscription-id: ${{ steps.config.outputs.azure_subscription_id }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "import src"

      - name: Run report quality gate
        env:
          AZURE_CLIENT_ID: ${{ steps.config.outputs.azure_client_id }}
          AZURE_TENANT_ID: ${{ steps.config.outputs.azure_tenant_id }}
          AZURE_SUBSCRIPTION_ID: ${{ steps.config.outputs.azure_subscription_id }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ steps.config.outputs.foundry_project_endpoint }}
          FOUNDRY_COORDINATOR_AGENT_NAME: ${{ steps.config.outputs.foundry_coordinator_agent_name }}
          FOUNDRY_RESOURCE_GRAPH_AGENT_NAME: ${{ steps.config.outputs.foundry_resource_graph_agent_name }}
          FOUNDRY_AZURE_MCP_AGENT_NAME: ${{ steps.config.outputs.foundry_azure_mcp_agent_name }}
          FOUNDRY_AZURE_API_AGENT_NAME: ${{ steps.config.outputs.foundry_azure_api_agent_name }}
          FOUNDRY_REPORT_WRITER_AGENT_NAME: ${{ steps.config.outputs.foundry_report_writer_agent_name }}
          FOUNDRY_QUALITY_REVIEWER_AGENT_NAME: ${{ steps.config.outputs.foundry_quality_reviewer_agent_name }}
          AZBRIEF_VERBOSE: "false"
          FAIL_UNDER: ${{ github.event.inputs.fail_under || '3.0' }}
          MIN_TRAJECTORY: ${{ github.event.inputs.min_trajectory || '60' }}
          ITERATIONS: ${{ github.event.inputs.iterations || '1' }}
        run: |
          python -m scripts.evaluate_report \
            --latest \
            --with-html \
            --iterate "${ITERATIONS}" \
            --fail-under "${FAIL_UNDER}" \
            --min-trajectory "${MIN_TRAJECTORY}"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-quality-artifacts
          path: eval_runs/
          retention-days: 14
          if-no-files-found: ignore
